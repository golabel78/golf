<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>클럽 계획 수정</title>
<style>body{font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;background:#f0f4f8;margin:0;padding:20px;color:#1e3c72;}
.box{max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
h1{font-size:1.2em;margin:0 0 6px;}p{font-size:.86em;color:#555;line-height:1.5;}
button{width:100%;padding:14px;font-size:1.05em;font-weight:700;border:none;border-radius:8px;background:#2a5298;color:#fff;margin-top:12px;}
#log{margin-top:16px;font-size:.84em;white-space:pre-wrap;background:#f7f9fc;border-radius:8px;padding:12px;line-height:1.7;}
.ok{color:#2e7d32;font-weight:700}.err{color:#c62828;font-weight:700}.warn{color:#e65100;font-weight:700}</style></head><body>
<div class="box"><h1>⛳ 클럽 계획 현실화 (우드·유틸 제외)</h1>
<p>프리스틴밸리(밸리/프리스틴)와 포천 힐마루 선샤인의 <b>홀별 계획 클럽</b>을 네 실제 클럽(DR·5i·아이언·웨지)으로 바꿉니다. <b>홀맵·경로·메모는 그대로 보존</b>, 계획 클럽만 교체합니다. 선샤인 코스가 없으면 새로 만듭니다.</p>
<button id="go">계획 수정 실행</button><div id="log">대기 중…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://okscfgttlckufpzfqwcs.supabase.co','sb_publishable_cgJc4XV1iHQlUvxNR7iysQ_Q-5wSmev');
const P={"VALLEY": {"1": ["DR", "5i", "5i", "56", "PT", "PT"], "2": ["7i", "PT", "PT"], "3": ["DR", "6i", "PT", "PT"], "4": ["DR", "6i", "PT", "PT"], "5": ["DR", "5i", "5i", "PT", "PT"], "6": ["DR", "PW", "PT", "PT"], "7": ["DR", "6i", "PT", "PT"], "8": ["6i", "PT", "PT"], "9": ["DR", "5i", "56", "PT", "PT"]}, "PRISTINE": {"1": ["DR", "5i", "5i", "56", "PT", "PT"], "2": ["DR", "5i", "56", "PT", "PT"], "3": ["5i", "PT", "PT"], "4": ["DR", "9i", "PT", "PT"], "5": ["DR", "5i", "5i", "PT", "PT"], "6": ["6i", "PT", "PT"], "7": ["DR", "5i", "56", "PT", "PT"], "8": ["DR", "PW", "PT", "PT"], "9": ["DR", "5i", "56", "PT", "PT"]}, "SUNSHINE": {"1": ["DR", "5i", "56", "PT", "PT"], "2": ["DR", "52", "PT", "PT"], "3": ["7i", "PT", "PT"], "4": ["DR", "8i", "PT", "PT"], "5": ["DR", "5i", "52", "PT", "PT"], "6": ["7i", "PT", "PT"], "7": ["DR", "8i", "PT", "PT"], "8": ["6i", "PT", "PT"], "9": ["DR", "5i", "5i", "PT", "PT"]}, "SUN_PAR": [5, 4, 3, 4, 5, 3, 4, 3, 5], "SUN_RED": [345, 225, 105, 252, 338, 105, 257, 115, 380]};const logEl=document.getElementById('log');
function log(m,c){logEl.innerHTML+=(c?`<span class="${c}">${m}</span>`:m)+'\n';}
const norm=s=>(s||'').toLowerCase().replace(/\s/g,'');
function applyPlans(course,plans){let n=0;course.holes.forEach(h=>{const p=plans[String(h.number)];if(p){h.planClubs=p.slice();n++;}});return n;}
document.getElementById('go').onclick=async function(){this.disabled=true;logEl.innerHTML='';
 try{const {data:courses,error}=await sb.from('courses').select('*');if(error)throw new Error(error.message);
  // 밸리
  let v=courses.find(c=>norm(c.name).includes('밸리코스'));
  if(v){const n=applyPlans(v,P.VALLEY);await sb.from('courses').upsert({id:v.id,name:v.name,holes:v.holes});log(`✅ [${v.name}] 계획 클럽 ${n}홀 수정`,'ok');}
  else log('⚠️ 밸리코스 못 찾음','warn');
  // 프리스틴
  let pr=courses.find(c=>norm(c.name).includes('프리스틴코스'));
  if(pr){const n=applyPlans(pr,P.PRISTINE);await sb.from('courses').upsert({id:pr.id,name:pr.name,holes:pr.holes});log(`✅ [${pr.name}] 계획 클럽 ${n}홀 수정`,'ok');}
  else log('⚠️ 프리스틴 코스 못 찾음','warn');
  // 선샤인
  let s=courses.find(c=>norm(c.name).includes('선샤인'));
  if(s){const n=applyPlans(s,P.SUNSHINE);await sb.from('courses').upsert({id:s.id,name:s.name,holes:s.holes});log(`✅ [${s.name}] 계획 클럽 ${n}홀 수정`,'ok');}
  else{const holes=[];for(let i=0;i<9;i++){holes.push({number:i+1,par:P.SUN_PAR[i],dist:String(P.SUN_RED[i]),map:'',photos:[],waypoints:[],planClubs:(P.SUNSHINE[String(i+1)]||[]),planMemo:''});}
   await sb.from('courses').upsert({id:'c_hillmaru_sunshine',name:'포천 힐마루 선샤인',holes:holes});log('✅ [포천 힐마루 선샤인] 새 코스 생성 + 계획 클럽','ok');}
  log('\n🎉 완료! 앱 새로고침 → 라운드 준비에서 계획 클럽 확인','ok');
 }catch(e){log('\n'+(e.message||e),'err');this.disabled=false;}
};
</script></body></html>
