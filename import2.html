<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프리스틴밸리 메모 합치기</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#f0f4f8;margin:0;padding:20px;color:#1e3c72;}
  .box{max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
  h1{font-size:1.2em;margin:0 0 6px;}
  p{font-size:0.88em;color:#555;line-height:1.5;}
  button{width:100%;padding:14px;font-size:1.05em;font-weight:700;border:none;border-radius:8px;background:#2a5298;color:#fff;margin-top:12px;cursor:pointer;}
  button:disabled{opacity:.5;}
  #log{margin-top:16px;font-size:0.84em;white-space:pre-wrap;background:#f7f9fc;border-radius:8px;padding:12px;min-height:40px;line-height:1.7;}
  .ok{color:#2e7d32;font-weight:700;} .err{color:#c62828;font-weight:700;} .warn{color:#e65100;font-weight:700;}
</style>
</head>
<body>
<div class="box">
  <h1>⛳ 프리스틴밸리 메모 합치기</h1>
  <p>네가 그려둔 <b>밸리코스 / 프리스틴 코스</b>(홀맵 있는 것)에 위험홀 공략 메모·계획을 얹고, 작년 2025.09.28 라운드를 두 코스로 나눠 넣습니다. <b>홀맵·경로는 그대로 보존</b>되고, 중복된 18홀짜리 "프리스틴밸리 가평"은 삭제합니다.</p>
  <button id="go">합치기 실행</button>
  <div id="log">대기 중…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://okscfgttlckufpzfqwcs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cgJc4XV1iHQlUvxNR7iysQ_Q-5wSmev';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const logEl = document.getElementById('log');
function log(msg,cls){ logEl.innerHTML += (cls?`<span class="${cls}">${msg}</span>`:msg)+'\n'; }

// 홀번호별 메모/계획
const VALLEY_MEMO = {
  1:{plan:['DR','HY','5i','PT','PT'], memo:'⚠️ 롱파5·첫홀. 몸 안 풀렸으니 무리 금지 → 보기 플랜. 티샷 안전 최우선.'},
  4:{plan:['DR','5i','PT','PT'],      memo:'작년 더블. 중파4 — 보기 목표로 안전하게.'},
  5:{plan:['DR','3W','8i','PT','PT'], memo:'⚠️ 작년 더블(7). 롱파5 — 3온2퍼트 보기, 세컨 욕심 금지.'},
  6:{plan:['DR','PW','PT','PT'],      memo:'⭐ 숏파4! 작년 더블로 아까웠음. 거리 부담 없음 → 무조건 파 세이브.'},
  9:{plan:['DR','HY','PT','PT'],      memo:'작년 더블. 롱파4 — 보기만 해도 성공.'}
};
const PRISTINE_MEMO = {
  1:{plan:[], memo:'롱파5. 3온 보기 플랜으로.'},
  2:{plan:['DR','HY','PT','PT'], memo:'⚠️ 최악홀! 작년 트리플(7). 롱파4 — 티샷 OB만 피하고 "더블만 면하자".'},
  4:{plan:['DR','8i','PT','PT'], memo:'작년 더블. 중파4 — 파/보기 노림.'},
  5:{plan:[], memo:'롱파5. 보기 플랜.'},
  6:{plan:['6i','PT','PT'],      memo:'⭐ 숏파3! 작년 더블로 아까웠음. 핀 보고 파 세이브.'},
  8:{plan:[], memo:'숏파4. 파 노림 홀.'}
};
// 작년 홀별 스코어(gross)
const VALLEY_SCORE   = {1:5,2:3,3:5,4:6,5:7,6:6,7:5,8:3,9:6};
const PRISTINE_SCORE = {1:6,2:7,3:4,4:6,5:6,6:5,7:4,8:5,9:4};

function mergeMemo(course, memoMap){
  let applied=[];
  course.holes.forEach(h=>{
    const m=memoMap[Number(h.number)];
    if(m){ h.planMemo=m.memo; h.planClubs=m.plan.slice(); applied.push(h.number); }
  });
  return applied;
}
function buildRound(course, scoreMap, rid){
  const holes={};
  course.holes.forEach(h=>{ const n=Number(h.number); if(scoreMap[n]!=null){ holes[n]={score:scoreMap[n], par:h.par, plan:[], actual:[], misses:[], notes:''}; } });
  const total=Object.values(scoreMap).reduce((s,v)=>s+v,0);
  return { id:rid, course_id:course.id, data:{ date:'2025-09-28', total, holes } };
}

document.getElementById('go').onclick = async function(){
  this.disabled=true; logEl.innerHTML='';
  try{
    log('☁️ 코스 목록 불러오는 중…');
    const { data:courses, error } = await sb.from('courses').select('*');
    if(error) throw new Error('코스 조회 실패: '+error.message);
    const norm=s=>(s||'').replace(/\s/g,'');
    const valley   = courses.find(c=>norm(c.name).includes('밸리코스'));
    const pristine = courses.find(c=>norm(c.name).includes('프리스틴코스'));
    if(!valley){ log('⚠️ "밸리코스"를 못 찾음 — 코스명 확인 필요','warn'); }
    if(!pristine){ log('⚠️ "프리스틴 코스"를 못 찾음 — 코스명 확인 필요','warn'); }

    if(valley){
      const a=mergeMemo(valley, VALLEY_MEMO);
      let r=await sb.from('courses').upsert({id:valley.id,name:valley.name,holes:valley.holes});
      if(r.error) throw new Error('밸리코스 저장 실패: '+r.error.message);
      log(`✅ 밸리코스 메모 적용 (홀 ${a.join(', ')}) + 홀맵 보존`,'ok');
      let rr=await sb.from('rounds').upsert(buildRound(valley, VALLEY_SCORE, 'r_pv_valley_20250928'));
      if(rr.error) log('⚠️ 밸리코스 작년기록 저장 실패: '+rr.error.message,'warn');
      else log('✅ 밸리코스 작년 라운드(46타) 저장','ok');
    }
    if(pristine){
      const a=mergeMemo(pristine, PRISTINE_MEMO);
      let r=await sb.from('courses').upsert({id:pristine.id,name:pristine.name,holes:pristine.holes});
      if(r.error) throw new Error('프리스틴코스 저장 실패: '+r.error.message);
      log(`✅ 프리스틴 코스 메모 적용 (홀 ${a.join(', ')}) + 홀맵 보존`,'ok');
      let rr=await sb.from('rounds').upsert(buildRound(pristine, PRISTINE_SCORE, 'r_pv_pristine_20250928'));
      if(rr.error) log('⚠️ 프리스틴코스 작년기록 저장 실패: '+rr.error.message,'warn');
      else log('✅ 프리스틴 코스 작년 라운드(47타) 저장','ok');
    }

    // 중복 18홀 코스 + 그 라운드 삭제
    log('🗑️ 중복 코스 정리 중…');
    let d1=await sb.from('courses').delete().eq('id','c_pristine_gapyeong');
    let d2=await sb.from('rounds').delete().eq('id','r_pristine_20250928');
    if(d1.error) log('⚠️ 18홀 코스 삭제 실패 — 앱에서 🗑삭제로 직접 지워줘','warn');
    else log('✅ 중복 "프리스틴밸리 가평"(18홀) 삭제','ok');

    log('\n🎉 완료! 골프 앱 새로고침 → 밸리코스/프리스틴 코스 라운드 시작하면 위험홀에서 메모가 뜹니다.','ok');
  }catch(e){
    log('\n'+(e.message||e),'err');
    this.disabled=false;
  }
};
</script>
</body>
</html>
